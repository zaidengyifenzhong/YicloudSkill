[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yicloud-skill"
version = "0.3.1"
description = "Yicloud API client, CLI and agent skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*.txt"]
dependencies = ["click>=8.1,<9", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2", "pyyaml>=6"]

[project.scripts]
yicloud = "yicloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yicloud = ["data/*.json", "skill/**/*.md", "skill/**/*.yaml", "skill/*.md"]

[tool.setuptools.exclude-package-data]
yicloud = ["*.log", "**/*.log"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
